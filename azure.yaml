# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: aks-designs
infra:
    layers:
      - name: platform
        provider: terraform
        module: main
        path: ./infra/platform_landing_zone
      - name: aks
        provider: terraform
        module: main
        path: ./infra/application_landing_zone
hooks:
  postprovision:
    shell: sh
    run: ./scripts/postprovision.sh

